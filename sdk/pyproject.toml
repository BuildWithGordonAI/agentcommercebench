[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gordonguard"
version = "0.1.0"
description = "Adversarial testing and runtime guarding for AI agents that spend money."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ai-agents", "security", "mcp", "agentic-commerce", "fraud", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The core is intentionally dependency-free: it must be trivial to drop into an
# existing agent without dragging in a dependency tree.
dependencies = []

[project.optional-dependencies]
# HTTP, JSON-RPC, A2A, UCP, and every model target use the standard library only.
# These extras exist for SDK-based transports, nothing else.
mcp = ["mcp>=1.2"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["mcp>=1.2", "langgraph>=0.2", "langchain-core>=0.3"]

[project.scripts]
gordonguard = "gordonguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gordonguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
