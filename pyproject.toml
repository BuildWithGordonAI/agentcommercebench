[project]
name = "agentic-fraud-detection"
version = "0.1.0"
description = "Agentic payment fraud detection layers for cognition, trajectory, tool trust, and settlement anomaly detection."
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pydantic>=2.8",
    "sentence-transformers>=2.2"
]
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
python_files = ["test_*.py"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fraud_detection"]
package-dir = {"" = "src"}
